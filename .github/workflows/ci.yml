name: ci

on:
  push:
    branches: [main, "feat/**", "refactor/**"]
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format 21.1.8 (libxr configuration)
        run: |
          pip install clang-format==21.1.8
          git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror

  host-tests:
    runs-on: ubuntu-latest
    env:
      # 需要的 libxr：SetCommandHook 带厂商命令长度钩子、WaitForWork、SetSessionResetGate、
      # WakeStep 和 VendorPort（release/0.6-candidate）/ The libxr required: SetCommandHook
      # with the vendor length hook, WaitForWork, SetSessionResetGate, WakeStep and
      # VendorPort (release/0.6-candidate).
      LIBXR_COMMIT: cdff20b553309d88a26b2f6420d995ffb31a7d8b
    steps:
      - uses: actions/checkout@v4
      - name: libxr
        run: |
          git clone --filter=blob:none https://github.com/xrobot-org/libxr.git "$RUNNER_TEMP/libxr"
          git -C "$RUNNER_TEMP/libxr" checkout "$LIBXR_COMMIT"
      - name: build
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libudev-dev
          cmake -S tests -B build -G Ninja -DLIBXR_DIR="$RUNNER_TEMP/libxr"
          cmake --build build
      - name: ctest
        run: ctest --test-dir build --output-on-failure
