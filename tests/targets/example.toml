# Target profile format. Real profiles are kept outside this repository and given with
# --target PATH. The addresses are placeholders.
name = "example-cortex-m4"
dpidr = 0x2BA01477                      # optional: TGT-01 compares it
openocd_target = "target/your-chip.cfg"  # OpenOCD target script (TOOL-01, STAB-02, STAB-08)
probe_rs_chip = "YOUR-CHIP"             # probe-rs --chip (TOOL-02)
pyocd_target = "your_chip"              # pyOCD -t (TOOL-03)
scratch = { base = 0x20001000, size = 0x4400 }     # RAM the tool may overwrite; restored after the run
dump = { base = 0x08000000, size = 0x20000 }       # region read by the TOOL cases
flash_test = { base = 0x0801C000, size = 0x4000 }  # flash the TOOL cases and STAB-02 may erase
# counter = 0x20000000        # optional: a u32 the target program increments (cores without CYCCNT)
# fault_address = 0xFFFFF000  # optional: an address whose read faults
# targetsel = 0x00040927      # optional: SWD multidrop, wake the SW-DP and send this TARGETSEL
# ap_base = 0x2000            # optional: ADIv6, base address of the MEM-AP; the cases that use the
#                             # READ, WRITE and sampling of the probe are n/a on such a target
